[build]
  command = "npm run build"

  # Public reCAPTCHA v3 site key (safe to commit — not the secret key).
  # Avoids setting NEXT_PUBLIC_* only in the Netlify UI for this value.
  [build.environment]
    NEXT_PUBLIC_RECAPTCHA_SITE_KEY = "6LdAnmotAAAAAKg8ZEFvKK1sfCL-7ZW_EWwxLkd8"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://rsacertify.netlify.app/*"
  to = "https://certify.rsamdio.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    # same-origin-allow-popups required for Firebase Google signInWithPopup
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-site"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # CSP is set per-request in src/middleware.ts (script nonces). Do not duplicate here.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/env.example"
  to = "/404.html"
  status = 404